  <text x="135" y="360" class="sans" font-size="13" font-weight="700" text-anchor="middle" fill="#9d3b0e">P2</text>
  <text x="180" y="362" class="sans" font-size="22" font-weight="700" fill="#17243a">Random comparator creates a biased shuffle</text>
  <text x="1320" y="360" class="mono" font-size="14" text-anchor="end" fill="#65738a">app.js · shuffled()</text>
  <text x="108" y="401" class="sans" font-size="16" fill="#42516a">Using randomness as a sort comparator does not define a consistent ordering. It can skew the</text>
  <text x="108" y="425" class="sans" font-size="16" fill="#42516a">permutations used for row groups, columns, digits, and blank-cell selection.</text>
  <rect x="108" y="448" width="1224" height="76" rx="8" fill="#f5f7fa"/>
  <text x="132" y="480" class="mono" font-size="17" fill="#9c2d2d">return [...items].sort(() =&gt; Math.random() - 0.5);</text>
  <text x="132" y="508" class="sans" font-size="14" font-weight="600" fill="#65738a">Suggested fix: use an in-place Fisher–Yates pass on a copied array.</text>

  <rect x="80" y="588" width="1280" height="246" rx="14" fill="#fff" stroke="#dce3ed"/>
  <rect x="80" y="588" width="7" height="246" rx="4" fill="#dc762e"/>
  <rect x="108" y="612" width="54" height="25" rx="12" fill="#fff0e5"/>
  <text x="135" y="630" class="sans" font-size="13" font-weight="700" text-anchor="middle" fill="#9d3b0e">P2</text>
  <text x="180" y="632" class="sans" font-size="22" font-weight="700" fill="#17243a">Starting a new game retains Notes mode</text>
  <text x="1320" y="630" class="mono" font-size="14" text-anchor="end" fill="#65738a">app.js · newGame()</text>
  <text x="108" y="671" class="sans" font-size="16" fill="#42516a">Changing difficulty rebuilds the puzzle but leaves notesMode and the button’s aria-pressed state</text>
  <text x="108" y="695" class="sans" font-size="16" fill="#42516a">untouched. A fresh board can therefore begin in the prior game’s editing mode.</text>
  <rect x="108" y="718" width="1224" height="76" rx="8" fill="#f5f7fa"/>
  <text x="132" y="750" class="mono" font-size="16" fill="#526078">function newGame(level) {</text>
  <text x="132" y="778" class="mono" font-size="16" fill="#526078">  activeLevel = level;  // notes state is not reset here</text>

